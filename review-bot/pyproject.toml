[project]
name = "gatesmith-review"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["packaging>=24", "pydantic>=2.9,<3", "ruamel.yaml>=0.18", "qscore"]
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/qscore_review"]
